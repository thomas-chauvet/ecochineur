name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags are required so the build can derive the version
          # from `git describe` and git-cliff can generate the changelog.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npm audit --audit-level=high

      - run: npx playwright install --with-deps chromium

      # Rebuilds dist/ and checks the exact build that gets zipped below.
      - run: npm run test:e2e

      - name: Package extension
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release
          cd dist && zip -qr "../release/ecochineur-${TAG}.zip" .

      - name: Generate release notes (this tag)
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate full changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --output /tmp/CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated changelog to main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          cp /tmp/CHANGELOG.md CHANGELOG.md
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md unchanged; nothing to commit."
            exit 0
          fi
          git add CHANGELOG.md
          git commit -m "chore(release): update changelog for ${TAG} [skip ci]"
          git push origin main

      - uses: softprops/action-gh-release@v3
        with:
          files: release/ecochineur-${{ github.ref_name }}.zip
          body_path: RELEASE_NOTES.md
          # Tags with a suffix (v1.2.3-rc.1) are pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
