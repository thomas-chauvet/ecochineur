<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>EcoChineur store screenshot</title>
    <style>
      body {
        align-items: center;
        background: linear-gradient(135deg, #f7f5ef 0%, #e2ede1 100%);
        color: #223026;
        display: flex;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        gap: 80px;
        height: 800px;
        justify-content: center;
        margin: 0;
        overflow: hidden;
        width: 1280px;
      }

      .copy {
        width: 520px;
      }

      .logo {
        height: 72px;
        width: 72px;
      }

      h1 {
        font-size: 50px;
        letter-spacing: -0.02em;
        line-height: 1.1;
        margin: 18px 0 14px;
      }

      .lead {
        color: #3d5144;
        font-size: 24px;
        line-height: 1.35;
        margin: 0 0 30px;
      }

      ul {
        display: grid;
        font-size: 20px;
        gap: 14px;
        list-style: none;
        margin: 0;
        padding: 0;
      }

      li::before {
        color: #2f6f4f;
        content: '✓';
        font-weight: 800;
        margin-right: 12px;
      }

      .frame {
        background: #f7f5ef;
        border-radius: 14px;
        box-shadow: 0 24px 60px rgba(34, 48, 38, 0.25);
        height: 620px;
        overflow: hidden;
        width: 360px;
      }

      iframe {
        border: 0;
        display: block;
        height: 620px;
        width: 360px;
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <img class="logo" src="/icons/icon.svg" alt="" />
      <h1 id="title"></h1>
      <p class="lead" id="lead"></p>
      <ul id="points"></ul>
    </div>
    <div class="frame">
      <iframe id="popup" title="EcoChineur popup"></iframe>
    </div>

    <script>
      // Usage: /store/screenshot.html?lang=en&scene=filters
      // Scenes: filters (options ticked) | brands (brand list open).
      const params = new URLSearchParams(location.search);
      const lang = params.get('lang') === 'en' ? 'en' : 'fr';
      const scene = params.get('scene') === 'brands' ? 'brands' : 'filters';

      const copy = {
        en: {
          filters: {
            title: 'Shop second-hand, more responsibly',
            lead: 'Add ethical brand and natural material filters to your Vinted searches in one click.',
            points: [
              'French, European and eco-conscious brands',
              'Linen, wool, cashmere and other natural materials',
              'Keeps your search, price and size filters',
            ],
          },
          brands: {
            title: 'Know why a brand is listed',
            lead: 'Every brand comes with a short, documented reason.',
            points: [
              'Brand IDs verified on Vinted',
              'No account, no tracking, no data collection',
              'Free and open source',
            ],
          },
        },
        fr: {
          filters: {
            title: 'Chinez en seconde main, autrement',
            lead: 'Ajoutez des filtres marques éthiques et matières naturelles à vos recherches Vinted, en un clic.',
            points: [
              'Marques françaises, européennes et éco-responsables',
              'Lin, laine, cachemire et autres matières naturelles',
              'Vos filtres de recherche, prix et taille sont conservés',
            ],
          },
          brands: {
            title: 'Sachez pourquoi une marque est listée',
            lead: 'Chaque marque est accompagnée d’une justification courte et documentée.',
            points: [
              'Identifiants de marques vérifiés sur Vinted',
              'Sans compte, sans pistage, sans collecte de données',
              'Libre et open source',
            ],
          },
        },
      }[lang][scene];

      document.documentElement.lang = lang;
      document.getElementById('title').textContent = copy.title;
      document.getElementById('lead').textContent = copy.lead;
      document
        .getElementById('points')
        .replaceChildren(
          ...copy.points.map((point) =>
            Object.assign(document.createElement('li'), { textContent: point }),
          ),
        );

      const popupParams = new URLSearchParams({
        lang,
        categories: scene === 'brands' ? 'eco' : 'france,europe',
        materials: scene === 'brands' ? '' : '146,46,123',
        browse: scene === 'brands' ? '1' : '',
      });
      document.getElementById('popup').src =
        `/tests/manual/popup-harness.html?${popupParams}`;
    </script>
  </body>
</html>
