<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>EcoChineur marquee promo tile</title>
    <style>
      body {
        align-items: center;
        background: linear-gradient(135deg, #2f6f4f 0%, #1d4f3a 100%);
        color: #ffffff;
        display: flex;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        gap: 72px;
        height: 560px;
        justify-content: center;
        margin: 0;
        overflow: hidden;
        width: 1400px;
      }

      .copy {
        width: 640px;
      }

      .lockup {
        align-items: center;
        display: flex;
        gap: 20px;
      }

      .logo {
        background: #f7f5ef;
        border-radius: 20px;
        height: 84px;
        padding: 8px;
        width: 84px;
      }

      h1 {
        font-size: 60px;
        letter-spacing: -0.02em;
        margin: 0;
      }

      .tagline {
        color: #d8e8da;
        font-size: 30px;
        line-height: 1.3;
        margin: 26px 0 30px;
      }

      .points {
        color: #eaf3ea;
        display: grid;
        font-size: 22px;
        gap: 12px;
        list-style: none;
        margin: 0;
        padding: 0;
      }

      li::before {
        color: #b9e28c;
        content: '✓';
        font-weight: 800;
        margin-right: 12px;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        width: 420px;
      }

      .chip {
        background: rgba(247, 245, 239, 0.12);
        border: 1px solid rgba(247, 245, 239, 0.35);
        border-radius: 999px;
        color: #f7f5ef;
        font-size: 22px;
        padding: 12px 20px;
      }

      .chip.accent {
        background: #b9e28c;
        border-color: #b9e28c;
        color: #1d4f3a;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="lockup">
        <img class="logo" src="/icons/icon.svg" alt="" />
        <h1>EcoChineur</h1>
      </div>
      <p class="tagline" id="tagline"></p>
      <ul class="points" id="points"></ul>
    </div>
    <div class="chips" id="chips"></div>

    <script>
      // Usage: /store/marquee.html?lang=en   (1400x560, Chrome Web Store marquee)
      const lang =
        new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'fr';
      const copy = {
        en: {
          tagline:
            'Ethical brand and natural material filters for your Vinted searches.',
          points: [
            'Keeps the filters you already set',
            'No account, no tracking, no data collection',
            'English and French, all Vinted countries',
          ],
          chips: [
            'French brands',
            'European brands',
            'Eco-conscious',
            'Linen',
            'Wool',
            'Cashmere',
            'Silk',
          ],
        },
        fr: {
          tagline:
            'Filtres marques éthiques et matières naturelles pour vos recherches Vinted.',
          points: [
            'Vos filtres déjà choisis sont conservés',
            'Sans compte, sans pistage, sans collecte de données',
            'Français et anglais, tous les pays Vinted',
          ],
          chips: [
            'Marques françaises',
            'Marques européennes',
            'Éco-responsables',
            'Lin',
            'Laine',
            'Cachemire',
            'Soie',
          ],
        },
      }[lang];

      document.documentElement.lang = lang;
      document.getElementById('tagline').textContent = copy.tagline;
      document
        .getElementById('points')
        .replaceChildren(
          ...copy.points.map((point) =>
            Object.assign(document.createElement('li'), { textContent: point }),
          ),
        );
      document.getElementById('chips').replaceChildren(
        ...copy.chips.map((chip, index) =>
          Object.assign(document.createElement('span'), {
            className: index < 3 ? 'chip accent' : 'chip',
            textContent: chip,
          }),
        ),
      );
    </script>
  </body>
</html>
