<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>EcoChineur small promo tile</title>
    <style>
      body {
        align-items: center;
        background: linear-gradient(135deg, #2f6f4f 0%, #1d4f3a 100%);
        color: #ffffff;
        display: flex;
        flex-direction: column;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        height: 280px;
        justify-content: center;
        margin: 0;
        overflow: hidden;
        text-align: center;
        width: 440px;
      }

      .logo {
        background: #f7f5ef;
        border-radius: 18px;
        height: 76px;
        padding: 8px;
        width: 76px;
      }

      h1 {
        font-size: 36px;
        letter-spacing: -0.01em;
        margin: 14px 0 6px;
      }

      p {
        color: #d8e8da;
        font-size: 18px;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <img class="logo" src="/icons/icon.svg" alt="" />
    <h1>EcoChineur</h1>
    <p id="tagline"></p>
    <script>
      // Usage: /store/promo-tile.html?lang=en
      const lang =
        new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'fr';
      document.getElementById('tagline').textContent =
        lang === 'en'
          ? 'Ethical brand & material filters for Vinted'
          : 'Filtres marques éthiques et matières pour Vinted';
    </script>
  </body>
</html>
