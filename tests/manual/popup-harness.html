<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcoChineur popup harness</title>
    <script>
      // Minimal chrome.* mock. Inspect window.__ecochineur in DevTools; the
      // last navigated URL is also exposed as body[data-updated-url].
      // Optional URL params preset the stored preferences (used by store/):
      //   ?lang=en&categories=france,eco&materials=146,46&browse=1
      const params = new URLSearchParams(location.search);
      const list = (name) =>
        (params.get(name) || '').split(',').filter(Boolean);
      window.__ecochineur = {
        updatedTabs: [],
        storage: {
          'ecochineur.preferences': {
            selectedCategories: list('categories'),
            selectedMaterialIds: list('materials').map(Number),
            language: params.get('lang') === 'en' ? 'en' : 'fr',
          },
        },
      };
      window.chrome = {
        storage: {
          local: {
            get: async (key) => ({ [key]: window.__ecochineur.storage[key] }),
            set: async (value) => {
              Object.assign(window.__ecochineur.storage, value);
            },
          },
        },
        tabs: {
          query: async () => [
            {
              id: 1,
              url: 'https://www.vinted.fr/catalog?search_text=jeans&price_to=30&brand_ids[]=123&material_ids[]=146',
            },
          ],
          update: async (id, value) => {
            window.__ecochineur.updatedTabs.push({ id, value });
            document.body.dataset.updatedUrl = value.url;
          },
        },
      };
      window.close = () => console.info('[harness] window.close()');
      window.confirm = () => true;
    </script>
    <script type="module">
      // Reuse the real popup markup so this harness never drifts from it.
      const response = await fetch('/src/popup/popup.html');
      const popup = new DOMParser().parseFromString(
        await response.text(),
        'text/html',
      );
      document.body.replaceChildren(...popup.body.childNodes);
      await import('/src/popup/popup.ts');

      if (new URLSearchParams(location.search).get('browse') === '1') {
        // popup.ts initializes asynchronously (it awaits storage first).
        setTimeout(() => document.getElementById('toggle-brands').click(), 200);
      }
    </script>
  </head>
  <body></body>
</html>
